# Pinned to SGLang v0.5.21 (same digest as :latest on 2026-10-08, CUDA 13, B200-capable).
# On Modal, weights are downloaded with the HF_TOKEN from a secret named
# "huggingface":  modal secret create huggingface HF_TOKEN=$HF_TOKEN
target: local
gpu: B200
image: lmsysorg/sglang:v0.5.21
server: >-
  python -m sglang.launch_server
  --model-path Qwen/Qwen3.8-27B-FP8
  --tp-size 1
  --port 30000
bench: >-
  aiperf profile
  --model Qwen/Qwen3.8-27B-FP8
  --url http://localhost:30000
  --endpoint-type chat
  --streaming
  --concurrency 32
  --ui none
  --request-count 320
