# H4: can B take a cached prefix from A by block hash, without A computing it?
#
# This validates the peer lookup-and-pin branch of vLLM on two A100-80GB GPUs.
# One request goes to B with the prompt's block hashes. B sends LOOKUP_PIN_MSG
# to A over the NIXL side channel, A pins the blocks it holds and replies with
# their ids, and B pulls them and computes the rest. Prompts are turns of real agent sessions
# (nebius/SWE-agent-trajectories), so each turn extends the last.
#
#   full      A holds the whole prompt
#   partial   A holds the previous turn, so B computes the new turn's tokens
#   miss      A holds nothing, so B computes everything
#
# Each case also runs on today's flow (A prefills, B pulls) and as a recompute
# on B. The run fails if A computes anything for the peer request, if A's log
# shows no lookup, if B's pulled bytes don't match the prefix A held, if B's
# greedy output after a pull differs from its own recompute, or if A can't
# reset its prefix cache at the end, which would mean a pin leaked.
#
# The model is full attention: the branch pins only full-attention and MLA
# layouts, not hybrid models like Qwen3.8.
#
# A and B both start with peer_lookup on, so either can serve a lookup.
#
# Design, inputs and expected outcomes: examples/kv-transfer/h4.md
#
# Prepare once, with no GPU:  uv run ms build -f examples/kv-transfer/h4.yaml
# Run, with streamed logs:    uv run ms run -f examples/kv-transfer/h4.yaml --detach
target: modal
gpu: A100-80GB:2
dockerfile: Dockerfile.h4
sources:
  VLLM:
    repo: https://github.com/usationlabs/vllm
    ref: feat/nixl-peer-lookup-pin
secrets: [HF_TOKEN]

cache:
  prefetch: [Qwen/Qwen3-8B]

ready_url: http://localhost:8200/health
ready_timeout: 15m
timeout: 90m

report:
  - pip list 2>/dev/null | grep -i -E '^(vllm|nixl|torch) '
  - pip show vllm 2>/dev/null | grep -i -E '^(version|location)'
  - nvidia-smi --query-gpu=name,driver_version --format=csv
  - nvidia-smi nvlink --status

# Each server's lines are tagged [A] or [B]. Both run as kv_both so either can
# pull, and VLLM_SERVER_DEV_MODE exposes /reset_prefix_cache, which the probe
# uses between cases and for the leak check. The run stops if either exits.
server: |
  bash <<'EOF'
  export PYTHONPATH=/opt/nixl-error-mode
  export VLLM_SERVER_DEV_MODE=1
  # UCX_PROTO_INFO prints the protocol UCX picks for each operation, so B's
  # log shows the transport its KV reads take (cuda_ipc: GPU to GPU).
  export UCX_RCACHE_MAX_UNRELEASED=1024 UCX_PROTO_INFO=y

  # vLLM logs at INFO, but the peer lookup modules at DEBUG, so A's log shows
  # each lookup ("lookup_pin") and B's shows each hit. The NIXL worker modules
  # log at DEBUG too, with millisecond timestamps, so B's log shows when each
  # pull starts (start_load_kv), how long a handshake takes, and when the
  # worker reports it done (get_finished).
  cat > /tmp/vllm-logging.json <<'JSON'
  {
    "version": 1,
    "disable_existing_loggers": false,
    "formatters": {"vllm": {"()": "vllm.logging_utils.NewLineFormatter",
      "datefmt": "%m-%d %H:%M:%S",
      "format": "(%(vllm_process_name)s pid=%(process)d) %(levelname)s %(asctime)s.%(msecs)03d [%(fileinfo)s:%(lineno)d] %(message)s"}},
    "handlers": {"vllm": {"class": "logging.StreamHandler", "formatter": "vllm",
      "level": "DEBUG", "stream": "ext://sys.stdout"}},
    "loggers": {
      "vllm": {"handlers": ["vllm"], "level": "INFO", "propagate": false},
      "vllm.distributed.kv_transfer.kv_connector.v1.nixl.peer_pins": {"level": "DEBUG"},
      "vllm.distributed.kv_transfer.kv_connector.v1.nixl.pull_scheduler": {"level": "DEBUG"},
      "vllm.distributed.kv_transfer.kv_connector.v1.nixl.pull_worker": {"level": "DEBUG"},
      "vllm.distributed.kv_transfer.kv_connector.v1.nixl.base_worker": {"level": "DEBUG"}
    }
  }
  JSON
  export VLLM_LOGGING_CONFIG_PATH=/tmp/vllm-logging.json

  serve() {
    CUDA_VISIBLE_DEVICES=$2 VLLM_NIXL_SIDE_CHANNEL_PORT=$4 stdbuf -oL vllm serve Qwen/Qwen3-8B \
      --port $3 \
      --max-model-len 32768 \
      --gpu-memory-utilization 0.9 \
      --prefix-caching-hash-algo sha256 \
      --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_connector_extra_config":{"peer_lookup":true}}' \
      2>&1 | tee /tmp/server-$1.log | sed -u "s/^/[$1] /"
  }

  serve A 0 8100 5600 &
  serve B 1 8200 5601 &
  wait -n
  EOF

# The container mounts modelsight at /root/modelsight.
bench: >-
  PYTHONPATH=/root python -m modelsight.probes.kv_peer_lookup
  --model Qwen/Qwen3-8B
  --producer http://localhost:8100
  --consumer http://localhost:8200
  --producer-log /tmp/server-A.log
  --consumer-log /tmp/server-B.log
  --mode peer
  --sessions 20
  --max-prompt-tokens 30000
