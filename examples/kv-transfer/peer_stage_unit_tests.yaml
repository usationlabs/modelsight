# SCRATCH, not committed. The peer stage unit tests on a real GPU box: the peer
# pin, NIXL peer lookup and offloading tests of the feat/nixl-peer-stage branch
# (design/vllm/peer-pin-cpu-stage-fallback.md, section 4 "Unit tests"), plus the
# neighbours it must not break (prefix caching, NixlConnector, MultiConnector).
# Same shape as peer_lookup_unit_tests.yaml; no server is needed, a trivial one
# satisfies ms. The tests that build a VllmConfig need a device vLLM can infer.
#
# The image is Dockerfile.peer_stage: upstream main 3332daf8fe (the commit the
# branch last merged; its precompiled wheel is the install) with the branch's
# files laid over it. The pack base MUST be that commit, not the older 9df94b9977
# of the peer_lookup runs: the branch contains upstream changes up to 3332daf8fe,
# which differs from 9df94b9977 in csrc (FlashKDA) as well as Python, so an overlay
# diffed against 9df94b9977 over a 9df94b9977 wheel would pull in 94 upstream
# commits' files and mismatch the kernels.
#
# Prepare, with no GPU, from the repo root (re-run it whenever the branch changes):
#   examples/kv-transfer/prepare_local_vllm.sh /Users/bashorun/usation/vllm-peer-stage \
#       3332daf8fe613c0e3d7c06f42b12e95eb450aa1e local_vllm_peer_stage.tar.gz
#   uv run ms build -f examples/kv-transfer/peer_stage_unit_tests.yaml
# Run:
#   uv run ms run -f examples/kv-transfer/peer_stage_unit_tests.yaml --detach
target: modal
# The tests use opt-125m / Qwen3-0.6B and no A100-only kernels, so an L4 (24 GB)
# is enough.
gpu: L4
dockerfile: Dockerfile.peer_stage
sources:
  VLLM:
    repo: https://github.com/vllm-project/vllm
    # upstream main 3332daf8fe, the last upstream commit the branch merged
    ref: 3332daf8fe613c0e3d7c06f42b12e95eb450aa1e
secrets: [HF_TOKEN]

cache:
  prefetch: [facebook/opt-125m, facebook/opt-350m, Qwen/Qwen3-0.6B]

ready_url: http://localhost:8000/
ready_timeout: 5m
timeout: 60m

report:
  - cat /opt/vllm-tests/HEAD_SHA
  - pip list 2>/dev/null | grep -i -E '^(vllm|nixl|torch|pytest|ray) '
  - nvidia-smi --query-gpu=name,driver_version --format=csv

server: python -m http.server 8000 --bind 127.0.0.1

# Run from the tests' root so `tests.v1...` imports resolve; vllm itself is the
# installed package with the branch's files copied over it. The shell expands
# the test_nixl_peer_*.py glob.
bench: >-
  cd /opt/vllm-tests && PYTHONPATH=/opt/nixl-error-mode:/opt/vllm-tests
  python -m pytest -q -p no:cacheprovider
  tests/v1/core/test_prefix_pin.py
  tests/v1/kv_connector/unit/test_nixl_peer_*.py
  tests/v1/kv_connector/unit/test_nixl_remote_read_expiry.py
  tests/v1/kv_connector/unit/test_nixl_connector.py
  tests/v1/core/test_prefix_caching.py
  tests/v1/kv_connector/unit/offloading_connector/
  tests/v1/kv_connector/unit/test_multi_connector.py
  2>&1 | tee pytest.log
