[project]
name = "modelsight"
version = "0.1.0"
description = "Run AIPerf experiments on a local GPU machine or on Modal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "modal>=1.0",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.scripts]
modelsight = "modelsight.cli:app"
ms = "modelsight.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelsight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
